name: Testing campaign

# Randomized, chaos, fuzz and load tests: too slow for every push, so nightly and on demand.
# A failure names its seed; rerun it with the "seed" input to reproduce it exactly.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Base seed (empty for today's date)
        required: false
      scale:
        description: quick or nightly
        required: false
        default: nightly

permissions:
  contents: read

jobs:
  campaign:
    name: Campaign (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ["24.22.3", "26.13.1"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the campaign
        env:
          LOBSTER_CAMPAIGN_SCALE: ${{ inputs.scale || 'nightly' }}
          LOBSTER_CAMPAIGN_SEED: ${{ inputs.seed }}
        run: pnpm test:campaign
